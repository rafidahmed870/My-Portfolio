services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Use the "runner" stage as the final image
      target: runner
    container_name: rafid-studio-portfolio
    restart: unless-stopped
    ports:
      - "5040:5040"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=5040
      - HOSTNAME=0.0.0.0
    # Resource limits — tune to your VPS specs
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5040/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
